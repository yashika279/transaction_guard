<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="google-site-verification"
      content="3fRt1wO5NOTSNrsO_mR2Mj3zJNYB9IxPSV974gB2BB0"
    />
    <meta
      name="description"
      content="TransactionGuard is a Rails/ActiveRecord gem that detects HTTP, email, and job side effects inside database transactions."
    />
    <title>TransactionGuard — Rails gem for transaction side effects</title>
    <style>
      :root {
        --bg: #f3f6f4;
        --ink: #14201a;
        --muted: #3d5248;
        --accent: #0f6b4c;
        --line: #c5d4cc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, #dcece4 0%, transparent 45%),
          linear-gradient(160deg, #eef3f0 0%, var(--bg) 55%, #e4ebe7 100%);
      }

      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 4.5rem 1.5rem 3rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 2.75rem);
        letter-spacing: -0.03em;
        line-height: 1.1;
      }

      p {
        margin: 0 0 1.25rem;
        font-size: 1.05rem;
        line-height: 1.55;
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.75rem;
      }

      a {
        color: var(--accent);
      }

      .actions a {
        display: inline-block;
        padding: 0.7rem 1rem;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.7);
        text-decoration: none;
        color: var(--ink);
      }

      .actions a.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      code {
        font-size: 0.95em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TransactionGuard</h1>
      <p>
        A Rails / ActiveRecord gem that detects external side effects — HTTP
        requests, email delivery, and background jobs — performed inside
        database transactions.
      </p>
      <p>
        Install with <code>gem "transaction_guard"</code>.
      </p>
      <div class="actions">
        <a class="primary" href="https://rubygems.org/gems/transaction_guard"
          >RubyGems</a
        >
        <a href="https://github.com/yashika279/transaction_guard">GitHub</a>
        <a
          href="https://github.com/yashika279/transaction_guard/blob/master/README.md"
          >Docs</a
        >
      </div>
    </main>
  </body>
</html>
